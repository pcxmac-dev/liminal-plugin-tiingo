[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-plugin-tiingo"
version = "1.5.1"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Tiingo for Liminal: US stock daily bars from 1962 on a free Tiingo key, its forex minutes and Blue Ocean nights live on a paid plan."
readme = "README.md"
requires-python = ">=3.10"
# the app it plugs into; which of its releases can load it is the plugin API the plugin declares
# (PLUGIN.api, checked when the app loads it), not this line
dependencies = ["liminal-lib"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
tiingo = "liminal_plugin_tiingo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
