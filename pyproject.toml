[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-integrator-tiingo"
version = "0.2.0"  # the plugin's own release (CHANGELOG.md; every distribution of Liminal at 0.2.0 on release/0.2.0); the app shows it on the Plugins view
description = "Tiingo for Liminal: US stock daily bars from 1962 on a free Tiingo key, its forex minutes and Blue Ocean nights live on a paid plan."
readme = "README.md"
requires-python = ">=3.10"
# the app it plugs into; which of its releases can load it is the plugin API the plugin declares
# (the feeds' api, checked when the app loads it: 2.0, the class contract of liminal-libs 1.3.0), not this line
dependencies = ["liminal-libs>=1.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
tiingo = "plugin_integrator_tiingo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
